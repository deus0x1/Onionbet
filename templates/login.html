<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - OnionBet</title>
    <style>
        body { font-family: monospace; max-width: 400px; margin: 40px auto; padding: 20px; background: #111; color: #eee; }
        .field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; background: #222; color: #fff; border: 1px solid #444; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        a { color: #888; text-decoration: none; }
    </style>
</head>
<body>
    <h2>Login</h2>
    <form action="/login_post" method="POST">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Login</button>
    </form>
    <p><a href="/register">Need an account? Register here</a></p>
</body>
</html>
